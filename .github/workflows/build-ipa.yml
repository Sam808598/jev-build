name: Build JevJarvis IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: jev-chat/jev-chat-jarvis-ios
          ref: master

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List schemes (debug)
        run: xcodebuild -project JevJarvis.xcodeproj -list

      - name: Build for device (no code signing)
        run: |
          xcodebuild -project JevJarvis.xcodeproj -alltargets \
            -sdk iphoneos -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned IPA
        run: |
          APP=$(find ./DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          echo "Built app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r JevJarvis-unsigned.ipa Payload
          ls -lh JevJarvis-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-unsigned-ipa
          path: JevJarvis-unsigned.ipa
